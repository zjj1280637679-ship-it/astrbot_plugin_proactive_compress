name: Test proactive compression

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify repository-only assets stay out of archives
        shell: bash
        run: |
          git archive --format=zip HEAD -o /tmp/plugin.zip
          if unzip -Z1 /tmp/plugin.zip | grep -q '^assets/source/'; then
            echo 'Repository-only source artwork leaked into the release archive.' >&2
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt

      - name: Compile
        run: python -m compileall -q main.py tests

      - name: Lint
        run: ruff check main.py tests

      - name: Run simulated AstrBot integration tests
        run: pytest -q
